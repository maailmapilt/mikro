name: Avalda mikroökonoomika õpik

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Ehita õpik
    runs-on: ubuntu-latest

    steps:
      - name: Laadi lähtekood
        uses: actions/checkout@v6

      - name: Seadista GitHub Pages
        uses: actions/configure-pages@v5

      - name: Paigalda Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Valmista ühine kujundus ette
        run: |
          mkdir -p book/assets
          cp shared/design.css book/assets/design.css
      
      - name: Ehita HTML-õpik
        run: quarto render book

      - name: Laadi valmis veeb üles
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/_site

  deploy:
    name: Avalda veeb
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Avalda GitHub Pagesis
        id: deployment
        uses: actions/deploy-pages@v4
